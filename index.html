<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUBDZ | الاشتراكات الرقمية</title>

<meta name="description" content="SUBDZ - اشتراكات رقمية وخدمات ترفيهية">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#070707;
    color:#fff;
    line-height:1.6;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(10,10,10,.95);
    border-bottom:1px solid #242424;
    backdrop-filter:blur(10px);
}

.navbar{
    max-width:1150px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:30px;
    font-weight:900;
    color:#e50914;
}

.logo span{
    color:#fff;
}

.nav-button{
    background:#e50914;
    color:#fff;
    text-decoration:none;
    padding:10px 20px;
    border-radius:10px;
    font-weight:bold;
}

/* HERO */

.hero{
    text-align:center;
    padding:85px 20px 75px;
    background:
    radial-gradient(circle at center,#351010 0%,#100707 35%,#070707 70%);
}

.hero-badge{
    display:inline-block;
    background:#171717;
    border:1px solid #333;
    color:#ccc;
    padding:8px 16px;
    border-radius:30px;
    margin-bottom:20px;
    font-size:14px;
}

.hero h1{
    font-size:clamp(40px,8vw,70px);
    line-height:1.15;
    margin-bottom:20px;
}

.hero h1 span{
    color:#e50914;
}

.hero p{
    color:#aaa;
    font-size:18px;
    max-width:650px;
    margin:auto;
}

.hero-btn{
    display:inline-block;
    margin-top:30px;
    background:#e50914;
    color:#fff;
    padding:15px 30px;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.hero-btn:hover{
    transform:translateY(-3px);
}

/* SECTIONS */

.section{
    max-width:1150px;
    margin:auto;
    padding:60px 20px;
}

.section-title{
    text-align:center;
    margin-bottom:40px;
}

.section-title h2{
    font-size:36px;
    margin-bottom:8px;
}

.section-title p{
    color:#888;
}

/* PRODUCTS */

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:24px;
}

.card{
    background:#111;
    border:1px solid #292929;
    border-radius:22px;
    padding:25px;
    text-align:center;
    transition:.3s;
}

.card:hover{
    transform:translateY(-7px);
    border-color:#e50914;
    box-shadow:0 10px 35px rgba(229,9,20,.12);
}

.service-icon{
    width:85px;
    height:85px;
    margin:0 auto 18px;
    border-radius:22px;
    background:#1b1b1b;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    font-weight:900;
}

.netflix .service-icon{
    color:#e50914;
}

.shahid .service-icon{
    color:#21d66b;
}

.xbox .service-icon{
    color:#78c043;
}

.card h3{
    font-size:25px;
    margin-bottom:8px;
}

.card-description{
    color:#999;
    margin-bottom:22px;
}

/* OFFERS */

.offers{
    display:flex;
    flex-direction:column;
    gap:11px;
    margin-bottom:20px;
}

.offer{
    background:#191919;
    border:1px solid #2b2b2b;
    border-radius:12px;
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.offer-name{
    color:#ddd;
    font-weight:bold;
}

.price{
    color:#e50914;
    font-weight:bold;
}

/* BUTTON */

.order-btn{
    width:100%;
    border:none;
    background:#e50914;
    color:white;
    padding:14px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.order-btn:hover{
    background:#ff1723;
    transform:translateY(-2px);
}

/* STEPS */

.steps{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.step{
    background:#111;
    border:1px solid #252525;
    border-radius:18px;
    padding:28px 20px;
    text-align:center;
}

.number{
    width:48px;
    height:48px;
    background:#e50914;
    border-radius:50%;
    margin:0 auto 15px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    font-weight:bold;
}

.step p{
    color:#888;
